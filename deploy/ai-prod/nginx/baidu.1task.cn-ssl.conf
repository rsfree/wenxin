# baidu-service HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 已指向本机），自动续期并 reload nginx。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name baidu.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/baidu.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/baidu.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/baidu.1task.cn.log;
    error_log  /www/wwwlogs/baidu.1task.cn.error.log;

    auth_basic off;   # 显式声明：入口层不做认证（鉴权在服务侧 BAIDU_API_KEYS）

    # 🔴 运维面挡在**入口层**（2026-11-16 v0.0.18 起 /panel 出厂）：
    # 本部署 BAIDU_API_KEYS 为空（服务侧不鉴权），若不挡，任何人都能打开面板试跑、
    # 翻日志、甚至「铸造新身份」改写线上 cookie。面板只能走 SSH 隧道看。
    # 放在 location / 之前，^~ 保证不被 catch-all 吃掉。
    location ^~ /panel { return 404; }
    location = /stats { return 404; }

    # 根路径落地页**由服务自身渲染**（v0.0.7 起 app/landing.py）——入口层不再放静态副本，
    # 避免"两份落地页各自漂移"。（曾经的静态写法见 git 历史：Tengine 下 alias 指文件会 500。）
    location / { include /www/server/panel/vhost/nginx/baidu-proxy.inc; }
}
